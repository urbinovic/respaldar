<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Fuente de og.png (1200x630), la tarjeta que se ve al compartir el link.
     Se regenera con Edge headless --screenshot cuando cambie la marca. */
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;
    background:linear-gradient(155deg,#0f2a4a 0%,#16385f 68%,#1c4471 100%);
    font-family:Manrope,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;color:#fff}
  .caja{width:1010px}
  .logo{display:flex;align-items:center;gap:24px;margin-bottom:48px}
  .logo b{font-family:'Bricolage Grotesque';font-weight:800;font-size:46px;letter-spacing:-.04em;line-height:1;display:block}
  .logo span{display:block;font-size:19px;color:#aabfd3;margin-top:3px}
  h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:76px;line-height:1.08;letter-spacing:-.03em;margin-bottom:30px}
  h1 em{font-style:normal;color:#ff8a3d}
  p{font-size:28px;color:#aabfd3}
</style>
</head>
<body>
  <div class="caja">
    <div class="logo">
      <svg width="84" height="84" viewBox="0 0 100 100">
        <rect x="17" y="14" width="55" height="55" rx="12" fill="#ffffff" transform="rotate(-7 44.5 41.5)"/>
        <rect x="29" y="31" width="55" height="55" rx="12" fill="#ff8a3d" transform="rotate(-3 56.5 58.5)"/>
      </svg>
      <span><b>respald.ar</b><span>Soluciones informáticas</span></span>
    </div>
    <h1>Delegar no es perder el control.<br>Es <em>tenerlo por primera vez</em>.</h1>
    <p>Sistemas a medida · precio cerrado y fecha de entrega</p>
  </div>
</body>
</html>
